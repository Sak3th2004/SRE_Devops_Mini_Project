global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: health-dashboard
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:5000
        labels:
          runtime: docker
  - job_name: health-dashboard-k8s
    metrics_path: /metrics
    static_configs:
      - targets:
          - sre-prep-control-plane:30080
        labels:
          runtime: kubernetes
